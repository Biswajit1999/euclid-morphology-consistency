[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euclidmorph"
version = "0.2.0"
description = "Cross-filter and cross-method consistency comparison of real Euclid Q1 galaxy morphology measurements (IRSA TAP), companion to euclid-star-shapes and euclid-spectra-quality."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Biswajit Jana" }]
keywords = ["euclid", "galaxy-morphology", "astrophysics", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
euclidmorph = "euclidmorph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires internet access to the IRSA TAP service"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py310"
